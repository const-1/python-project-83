[project]
name = "hexlet-code"
version = "0.1.0"
requires-python = ">=3.8.1"
description = "Page Analyzer Project"
dependencies = [
    "flask==3.0.0",
    "gunicorn==21.2.0",
    "python-dotenv==1.0.0",
    "psycopg2==2.9.9",
    "validators==0.22.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.14.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.3.4",
    "pytest==7.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]

[dependency-groups]
dev = [
    "ruff>=0.3.4",
]
